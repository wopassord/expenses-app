<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ledger</title>
  <meta name="description" content="Personal expense tracker">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Ledger">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
  <script src="vendor/chart.umd.js" defer></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div id="setup" hidden></div>

  <div id="app" hidden>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="#/dashboard"><span class="brand-mark"></span>Ledger</a>
        <nav class="tabs" aria-label="Sections">
          <a href="#/dashboard" data-route="dashboard">Dashboard</a>
          <a href="#/transactions" data-route="transactions">Transactions</a>
          <a href="#/history" data-route="history">History</a>
          <a href="#/settings" data-route="settings">Settings</a>
        </nav>
        <div class="month-switch">
          <button class="icon-btn" data-month="-1" aria-label="Previous month"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
          <span id="month-label" class="month-label"></span>
          <button class="icon-btn" data-month="1" aria-label="Next month"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
          <button class="btn btn-ghost btn-sm" id="month-now" data-month="now" hidden>Today</button>
        </div>
        <button id="sync" class="sync-pill" type="button" aria-live="polite"></button>
      </div>
    </header>

    <main class="container">
      <section id="quick-add" class="quick-bar card" aria-label="Quick add"></section>
      <div id="view"></div>
    </main>

    <nav class="bottom-nav" aria-label="Sections">
      <a href="#/dashboard" data-route="dashboard"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span>Home</span></a>
      <a href="#/transactions" data-route="transactions"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span>Entries</span></a>
      <span class="bottom-nav-gap"></span>
      <a href="#/history" data-route="history"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 16v-5M12 16V8M17 16v-8"/></svg><span>History</span></a>
      <a href="#/settings" data-route="settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg><span>Settings</span></a>
    </nav>
    <button id="fab" class="fab" type="button" aria-label="Add entry"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
</body>
</html>
